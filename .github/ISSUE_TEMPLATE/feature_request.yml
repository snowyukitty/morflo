name: Feature request
description: Describe a task Morflo could make easier.
title: "[Feature]: "
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: "Describe the user and a concrete image or video conversion task."
    validations:
      required: true
  - type: textarea
    id: obstacle
    attributes:
      label: What gets in the way today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a useful result look like?
      description: "Include alternatives or workarounds. Do not attach personal media or private paths."
